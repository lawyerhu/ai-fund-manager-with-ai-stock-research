interface:
  display_name: "AI选股研究 · Luna → 当前对话模型"
  short_description: "复用现有股票池，由Luna筛选、当前对话模型深研并比较本轮第一名与跨轮有效首选，生成中文报告不下单"
  default_prompt: "使用 $ai-stock-research 复用最新候选，由当前对话模型（本次会话所用模型，不固定 gpt-6-astra 或 medium）完成Top 5深研，将本轮第一名与继承的 active_selection 比较，按最终 KEEP / SWITCH 保存有效首选状态并生成正式中文 DOCX 报告，不读取持仓、不下单。研究通过 session_handoff.py 在会话内完成，不调用独立模型 API。"
